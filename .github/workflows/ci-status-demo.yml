name: TestAgent CI - 7 status demo cases
run-name: 7 status demo cases - ${{ github.ref_name }}

on:
  push:
    branches: [master, 'aoce/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagent-status-demo-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  agent_status_demo:
    name: Playwright - 7 status demo cases
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CI: 'true'
      PYTHONUTF8: '1'
      AGENT_TEST_SUITE: status-demo
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: browser_runner/package-lock.json
      - name: Install dependencies and build runner
        run: |
          python -m pip install -r requirements-ci.lock
          npm ci --prefix browser_runner
          npm run build --prefix browser_runner
          npm run typecheck:agent --prefix browser_runner
      - name: Install Chromium and system dependencies
        working-directory: browser_runner
        run: npx playwright install --with-deps chromium
      - name: Execute 7 Playwright status demos (intentional FAIL, FLAKY and SKIP)
        working-directory: browser_runner
        run: npm run test:agent
      - name: Verify demo results and publish case summary
        if: ${{ always() }}
        env:
          DATA_DIR: ${{ runner.temp }}/agent-status-demo-data
          IMPORT_ROOT: ${{ runner.temp }}/agent-status-demo-imports
        run: python -m scripts.verify_playwright_report --suite status-demo
      - name: Upload demo Playwright HTML report and per-case evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-status-demo-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/playwright/status-demo/
          if-no-files-found: error
          retention-days: 7
