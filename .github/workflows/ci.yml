name: TestAgent CI

on:
  push:
    branches: [master, 'aoce/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testagent-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: 'true'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            browser_runner/package-lock.json
            web/package-lock.json
      - name: Prepare evidence directory
        run: mkdir -p output/aoce/ci
      - name: Install Python dependencies
        run: python -m pip install -r requirements-ci.lock
      - name: Install browser runner dependencies
        run: npm ci --prefix browser_runner
      - name: Build browser runner
        run: npm run build --prefix browser_runner
      - name: Install Chromium and system dependencies
        working-directory: browser_runner
        run: npx playwright install --with-deps chromium
      - name: Install frontend dependencies
        run: npm ci --prefix web
      - name: Build frontend
        run: npm run build --prefix web
      - name: Run reviewed agent regression and real browser workflows
        env:
          DATA_DIR: ${{ runner.temp }}/testagent-data
        run: python -m scripts.ci_verify
      - name: Record blocked execution if setup did not reach the tests
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          path = Path('output/aoce/ci/manifest.json')
          if not path.exists():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(json.dumps({
                  'outcome': 'BLOCKED', 'selected': None, 'executed': 0,
                  'code_revision': os.getenv('GITHUB_SHA'),
                  'run_id': os.getenv('GITHUB_RUN_ID'),
                  'attempt_id': os.getenv('GITHUB_RUN_ATTEMPT'),
                  'reason': 'Setup/build failed before the verification harness started.'
              }, indent=2))
          PY
      - name: Upload run evidence on success or failure
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: aoce-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: output/aoce/ci/
          if-no-files-found: error
          retention-days: 7
